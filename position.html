<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position</title>
    <style>
      .container {
        width: 500px;
        height: 500px;
        margin: 50px auto;
        background-color: #ddd;
        position: relative;
      }
      .red {
        width: 100px;
        height: 100px;
        background-color: #ff0000;
        position: relative;
        top: 100px;
        left: 200px;
      }
      .green {
        width: 100px;
        height: 100px;
        background-color: #073011;
        position: absolute;
        top: 50px;
        left: 60px;
      }
      .blue {
        width: 100px;
        height: 100px;
        border-radius: 100%;
        background-color: #1a0338;
        position: fixed;
        bottom: 0px;
        right: 0px;
      }
      .yellow{
        width: 50px;
        height: 50px;
        background-color: #a89806;
        position: sticky;
        top: 100px;
      }
      .spacer{height: 300vh;}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box red"></div>
      <div class="box green"></div>
      <div class="box blue"></div>
      <div class="box yellow"></div>
    </div>
    <div class="spacer"></div>
  </body>
</html>
