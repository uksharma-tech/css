<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>positionEx2.</title>
    <style>
      .container {
        position: relative;
        margin: auto;
        border: 2px solid rebeccapurple;
      }
      img {
        width: 100%;
        opacity: 0.5;
      }
      .left-top {
        position: absolute;
        top: 10px;
        left: 10px;
        color: red;
      }
      .right-top {
        position: absolute;
        top: 10px;
        right: 10px;
        color: red;
      }
      .bottom-left {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: red;
      }
      .bottom-right {
        position: absolute;
        bottom: 10px;
        right: 10px;
        color: red;
      }
      .centered {
        position: absolute;
        top: 50%;
        width: 100%;
        text-align: center;
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Image Text</h1>
    <p>
      Add some text on an image top-left ,top-right,bottom-left,bottom-right
      corner and centered position.
    </p>
    <div class="container">
      <img src="../images/img_5terre_wide.jpg" alt="noimg" />
      <div class="left-top">Left-Top</div>
      <div class="right-top">Right-Top</div>
      <div class="bottom-left">Bottom-Left</div>
      <div class="bottom-right">Botto-Right</div>
      <div class="centered">Centered</div>
    </div>
  </body>
</html>
