<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>positionEx.</title>
  </head>
  <style>
    body {
      border: 2px solid rgb(1, 1, 24);
    }
    .navbar {
      background-color: rgb(155, 10, 82);
      width: 100%;
      height: 50px;
      text-align: center;
      position: sticky;
      top: 0px;
    }
    .container {
      width: 80vw;
      height: 270vh;
      margin: auto;
      border: 2px solid red;
      background-color: #ddd;
      position: relative;
    }
    .static {
      width: 100px;
      height: 50px;
      border: 2px solid navy;
      text-align: center;
    }
    .relative {
      width: 100px;
      height: 50px;
      background-color: yellow;
      text-align: center;
      position: relative;
      top: 200px;
      left: 500px;
      text-align: center;
    }
    .fixed {
      width: 100px;
      height: 50px;
      background-color: rgb(14, 48, 160);
      position: fixed;
      bottom: 20px;
      right: 20px;
      text-align: center;
    }
    .sticky {
      width: 80px;
      height: 80px;
      border-radius: 40px;
      text-align: center;
      background-color: hotpink;
      position: sticky;
      top: 200px;
      left: 400px;
    }
    .absolute {
      width: 100px;
      height: 50px;
      text-align: center;
      background-color: rgb(22, 128, 8);
      position: absolute;
      top: 0;
      left: 350px;
    }
    .other1 {
      width: 100px;
      height: 50px;
      text-align: center;
      background-color: #414141;
    }
    .other2 {
      width: 100px;
      height: 50px;
      text-align: center;
      background-color: #d32323;
      color: white;
    }
  </style>
  <body>
    <div class="navbar">Navbar</div>
    <div class="container">
      <div class="static">Static</div>
      <div class="relative">Relative</div>
      <div class="fixed">Fixed</div>
      <div class="sticky">Sticky</div>
      <div class="other1">other1</div>
      <div class="absolute">Absolute</div>
      <div class="other2">other2</div>
    </div>
    <div
      style="height: 100vh; border: 2px solid green; background-color: #313131"
    ></div>
  </body>
</html>
